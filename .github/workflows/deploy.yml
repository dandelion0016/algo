name: CD Deploy to AWS (S3 + CloudFront)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # GitHub Actions OIDC認証用
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Extract Version & Create Tag/Release
        id: versioning
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --tags origin 2>/dev/null || true
          LATEST_TAG=$(git tag -l "v[0-9]*.[0-9]*.[0-9]*" --sort=-v:refname | head -n 1)

          if [ -z "$LATEST_TAG" ]; then
            echo "No existing tags found. Initializing release version..."
            PKG_VERSION=$(jq -r .version package.json 2>/dev/null || echo "0.1.0")
            VERSION="v${PKG_VERSION}"
          else
            echo "Latest tag found: $LATEST_TAG"
            VERSION_WITHOUT_V="${LATEST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_WITHOUT_V"
            PATCH=$((PATCH + 1))
            VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          fi

          # 既存タグとの重複を回避して確実に一意なバージョンを決定
          while git rev-parse "$VERSION" >/dev/null 2>&1 || git ls-remote --tags origin | grep -q "refs/tags/$VERSION"; do
            echo "Tag $VERSION already exists. Incrementing patch version..."
            PATCH=$((PATCH + 1))
            VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          done

          echo "Determined release version: $VERSION"
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$VERSION"
          git push origin "$VERSION"
          gh release create "$VERSION" --title "Release $VERSION" --generate-notes

      - name: Next.js Static Export Build
        run: npm run build
        env:
          NEXT_PUBLIC_APP_VERSION: ${{ env.APP_VERSION }}

      - name: Debug OIDC Token Claims
        run: |
          echo "=== Debugging GitHub Actions OIDC Token Claims ==="
          OIDC_TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          if [ -n "$OIDC_TOKEN" ] && [ "$OIDC_TOKEN" != "null" ]; then
            echo "Successfully retrieved OIDC token."
            echo "Decoded Payload:"
            echo "$OIDC_TOKEN" | cut -d'.' -f2 | base64 -d 2>/dev/null | jq '{iss, aud, sub, repository, repository_owner, ref, actor}' || true
          else
            echo "Failed to retrieve OIDC token or tokens are disabled in repo settings."
          fi

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::330631893499:role/algo-github-deploy-role
          aws-region: ap-northeast-1
          audience: sts.amazonaws.com

      - name: Deploy to S3 Bucket
        run: |
          aws s3 sync out/ s3://${{ secrets.S3_BUCKET_NAME }} --delete

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
