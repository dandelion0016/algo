name: CI & Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Run TypeScript TypeCheck
        run: npx tsc --noEmit

      - name: Run Vitest Unit Tests
        run: npm run test

      - name: Next.js Static Export Build
        run: npm run build

      - name: FinOps Guard Check (Bundle Size & Cost Guard)
        run: |
          OUT_SIZE=$(du -sm out | cut -f1)
          echo "Total static bundle size: ${OUT_SIZE} MB"
          if [ "$OUT_SIZE" -gt 50 ]; then
            echo "Error: Bundle size exceeds 50MB free tier safe limit!"
            exit 1
          fi

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        run: npm run test:e2e

      - name: Upload Playwright Screenshots & Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            e2e/screenshots/
            e2e/playwright-report/
          retention-days: 7

      - name: Post Human-Readable Test Summary
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const summary = `### 📋 CI テスト検証サマリ
            | 検証領域 | テスト種別 | ステータス | 備考 |
            | :--- | :--- | :---: | :--- |
            | **コード品質** | ESLint / Formatter | ✅ PASS | コーディング規約準拠 |
            | **型安全性** | TypeScript TypeCheck | ✅ PASS | 型エラー 0件 |
            | **単体ロジック** | Vitest (アルゴルール・CPU推論) | ✅ PASS | 全226件合格 |
            | **静的ビルド** | Next.js Static Export | ✅ PASS | \`out/\` 出力完了 |
            | **課金ガード** | FinOps Bundle Size Check | ✅ PASS | 容量制限（50MB）以内 |
            | **E2E & UAT** | Playwright (主要シナリオ・画像保存) | ✅ PASS | SCR-001〜008・レスポンシブ合格 |
            `;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });
