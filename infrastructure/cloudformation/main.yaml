AWSTemplateFormatVersion: '2010-09-09'
Description: 'Algo Web Battle System - Production Infrastructure (S3 + CloudFront OAC + Security Headers + Zero Cost Guard + GitHub OIDC Deploy IAM Role)'

Parameters:
  ProjectName:
    Type: String
    Default: 'algo'
    Description: 'Project prefix name'

  Environment:
    Type: String
    Default: 'prod'
    AllowedValues:
      - 'prod'
      - 'dev'
    Description: 'Deployment environment'

  AlertEmail:
    Type: String
    Description: 'Email address to receive AWS Budgets $0.01 zero-cost alerts'

  GitHubOrg:
    Type: String
    Default: 'dandelion0016'
    Description: 'GitHub organization or username owner of the repository'

  GitHubRepo:
    Type: String
    Default: 'algo'
    Description: 'GitHub repository name'

  CreateOIDCProvider:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: 'Whether to create GitHub OIDC Provider (set to false if token.actions.githubusercontent.com already exists in this account)'

Conditions:
  ShouldCreateOIDCProvider: !Equals [!Ref CreateOIDCProvider, 'true']

Resources:
  # =========================================================================
  # 1. Amazon S3 - Static Hosting Bucket
  # =========================================================================
  HostingBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-${Environment}-apne1-static-hosting-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: 'cloudformation'
        - Key: CostCenter
          Value: 'free-tier-algo'

  HostingBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref HostingBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: 'cloudfront.amazonaws.com'
            Action: 's3:GetObject'
            Resource: !Sub 'arn:aws:s3:::${HostingBucket}/*'
            Condition:
              StringEquals:
                'AWS:SourceArn': !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}'

  # =========================================================================
  # 2. Amazon CloudFront - Origin Access Control & Distribution
  # =========================================================================
  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${ProjectName}-${Environment}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  ResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${ProjectName}-${Environment}-security-headers'
        Comment: 'Security Headers for Algo Web Battle System'
        SecurityHeadersConfig:
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Preload: true
            Override: true
          XSSProtection:
            ModeBlock: true
            Protection: true
            Override: true

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub '${ProjectName} static web hosting distribution (${Environment})'
        DefaultRootObject: 'index.html'
        HttpVersion: 'http2and3'
        PriceClass: 'PriceClass_100' # Lowest cost price class (US, Europe, Japan edges)
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt HostingBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt CloudFrontOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: 'redirect-to-https'
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          ResponseHeadersPolicyId: !Ref ResponseHeadersPolicy
          # AWS Managed CachingOptimized Policy
          CachePolicyId: '658327ea-f89d-4fab-a63d-7e88639e58f6'
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: '/index.html'
            ErrorCachingMinTTL: 10
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: '/index.html'
            ErrorCachingMinTTL: 10
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: 'cloudformation'

  # =========================================================================
  # 3. AWS Budgets & CloudWatch - Zero Cost Guard Layer ($0.01 Budget Alert)
  # =========================================================================
  BudgetAlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${ProjectName}-${Environment}-finops-alerts'
      Subscription:
        - Endpoint: !Ref AlertEmail
          Protocol: email

  BudgetAlertTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref BudgetAlertTopic
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowAWSBudgetsPublish
            Effect: Allow
            Principal:
              Service: 'budgets.amazonaws.com'
            Action: 'sns:Publish'
            Resource: !Ref BudgetAlertTopic

  ZeroCostBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub '${ProjectName}-${Environment}-zero-cost-guard'
        BudgetLimit:
          Amount: 0.01
          Unit: USD
        TimeUnit: MONTHLY
        BudgetType: COST
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100 # 100% of $0.01 = $0.01
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref BudgetAlertTopic
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100 # Forecasted to exceed $0.01
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref BudgetAlertTopic
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail

  # =========================================================================
  # 4. GitHub Actions OIDC Provider & Deployment IAM Role (Keyless CI/CD)
  # =========================================================================
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateOIDCProvider
    Properties:
      Url: 'https://token.actions.githubusercontent.com'
      ClientIdList:
        - 'sts.amazonaws.com'
      ThumbprintList:
        - '6938fd4d98bab03faadb97b34396831e3780aea1'
        - '1c58a3a8518e8759bf075b76b750d4f8d264fcd3'

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-github-deploy-role'
      Description: !Sub 'Deployment role for GitHub Actions CI/CD (${GitHubOrg}/${GitHubRepo})'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowGitHubActionsOIDCAssumeRole
            Effect: Allow
            Principal:
              Federated: !Sub 'arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: 'sts:AssumeRoleWithWebIdentity'
            Condition:
              StringEquals:
                'token.actions.githubusercontent.com:aud': 'sts.amazonaws.com'
              StringLike:
                'token.actions.githubusercontent.com:sub': !Sub 'repo:${GitHubOrg}/${GitHubRepo}:*'
      Policies:
        - PolicyName: !Sub '${ProjectName}-s3-cloudfront-deploy-policy'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: S3StaticBucketSyncList
                Effect: Allow
                Action:
                  - 's3:ListBucket'
                  - 's3:GetBucketLocation'
                Resource: !GetAtt HostingBucket.Arn
              - Sid: S3StaticBucketObjectOperations
                Effect: Allow
                Action:
                  - 's3:PutObject'
                  - 's3:GetObject'
                  - 's3:DeleteObject'
                Resource: !Sub '${HostingBucket.Arn}/*'
              - Sid: CloudFrontInvalidateCache
                Effect: Allow
                Action:
                  - 'cloudfront:CreateInvalidation'
                  - 'cloudfront:GetInvalidation'
                Resource: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}'
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: 'cloudformation'

Outputs:
  HostingBucketName:
    Description: 'Name of the S3 static hosting bucket'
    Value: !Ref HostingBucket
    Export:
      Name: !Sub '${AWS::StackName}-BucketName'

  CloudFrontDistributionId:
    Description: 'CloudFront Distribution ID'
    Value: !Ref CloudFrontDistribution
    Export:
      Name: !Sub '${AWS::StackName}-DistributionId'

  CloudFrontDomainName:
    Description: 'CloudFront Default Domain Name (HTTPS URL)'
    Value: !GetAtt CloudFrontDistribution.DomainName
    Export:
      Name: !Sub '${AWS::StackName}-DomainName'

  DeployRoleArn:
    Description: 'IAM Role ARN for GitHub Actions OIDC deployment'
    Value: !GetAtt DeployRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-DeployRoleArn'

  ZeroCostAlertTopicArn:
    Description: 'SNS Topic ARN for Budgets Zero Cost Guard'
    Value: !Ref BudgetAlertTopic
